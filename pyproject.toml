[project]
name = "nebula3-mcp"
version = "0.1.0"
description = "Local MCP server for NebulaGraph 3.8 graph databases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anyio>=4.8,<5",
  "mcp>=2,<3",
  "nebula3-python==3.8.3",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=9.0.2,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
nebula3-mcp = "nebula3_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebula3_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nebula3_mcp"]
